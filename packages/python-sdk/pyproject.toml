[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentreplay"
version = "0.1.0"
authors = [
  { name="AgentReplay Team", email="team@agentreplay.dev" },
]
description = "Lightweight Python SDK for AgentReplay."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/agentreplay/agentreplay"
"Bug Tracker" = "https://github.com/agentreplay/agentreplay/issues"
